name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp config.example.json config.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          GITHUB_TOKEN: dummy
          LINEAR_API_KEY: dummy
